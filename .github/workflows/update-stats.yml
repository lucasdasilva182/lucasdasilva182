name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 6 * * *'  # todo dia às 06:00 UTC (~03:00 BRT)
  workflow_dispatch:  # permite rodar manualmente também

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar stats card atualizado
        run: |
          curl -sf "https://github-readme-stats-408gge7pw-zhorzon.vercel.app/api?username=lucasdasilva182&show_icons=true&hide_border=false&title_color=a78bfa&bg_color=181818&border_radius=16&border_color=252525&text_color=EEE&custom_title=Github+stats&icon_color=a78bfa" -o github-stats.svg

      - name: Commitar se houve mudança
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza github-stats.svg"
          file_pattern: github-stats.svg
